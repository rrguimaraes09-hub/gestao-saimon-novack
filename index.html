<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão Saimon Novack</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saimon Novack">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: barra carvão fixa no topo com a marca e as abas; área de trabalho clara em creme; cartões só onde há objeto (cartão do funil, painel de cálculo) */
:root{
  --bg:#EFEBE3; --surface:#FBF9F5; --sunk:#E6E1D6; --ink:#1B1A1A; --muted:#6B675E; --line:#D8D1C3;
  --gold:#76713F; --gold-soft:#A09C6B; --head:#1B1A1A; --head-ink:#EFEBE3;
  --ok:#4D6A39; --warn:#9A6A1F; --bad:#A3392B;
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1E1D1B; --sunk:#191817; --ink:#EFEBE3; --muted:#A39E93; --line:#33312C;
  --gold:#C3BD86; --gold-soft:#A09C6B; --head:#0C0B0B; --head-ink:#EFEBE3;
  --ok:#8DB173; --warn:#D7A75A; --bad:#E07A6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1E1D1B; --sunk:#191817; --ink:#EFEBE3; --muted:#A39E93; --line:#33312C;
  --gold:#C3BD86; --gold-soft:#A09C6B; --head:#0C0B0B; --head-ink:#EFEBE3;
  --ok:#8DB173; --warn:#D7A75A; --bad:#E07A6A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.5 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h2{font-size:1.5rem} h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hwrap{max-width:1280px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{display:flex;align-items:center;color:var(--gold-soft);border-right:1px solid #ffffff33;padding-right:12px}
.brand .logo svg{height:36px;width:auto;display:block}
.brand b{font-family:var(--display);font-weight:500;letter-spacing:.14em;font-size:.82rem;display:block}
.brand small{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav button{background:none;border:0;color:var(--head-ink);opacity:.7;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:.86rem}
nav button:hover{opacity:1}
nav button[aria-current="page"]{opacity:1;background:#ffffff14;box-shadow:inset 0 -2px 0 var(--gold-soft)}
.user{display:flex;align-items:center;gap:10px;font-size:.78rem;opacity:.85;white-space:nowrap}
.user button{background:none;border:1px solid #ffffff33;color:var(--head-ink);padding:4px 10px;border-radius:999px;cursor:pointer;font-size:.78rem}
.user button:hover{border-color:var(--gold-soft)}

main{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--gold-soft)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600}
.chip.ex{border-style:dashed}
.chip.gold{border-color:var(--gold-soft);color:var(--gold)}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;color:var(--muted);margin-bottom:16px}
.notice.warn{border-color:var(--warn);color:var(--ink)}

/* Login */
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .panel{display:flex;flex-direction:column;gap:14px}
.login p{margin:0;color:var(--muted)}

/* Funil */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:12px;padding:10px;min-height:180px;display:flex;flex-direction:column;gap:8px}
.col h3{font-family:var(--body);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;padding:2px 4px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left}
.card:hover{border-color:var(--gold-soft)}
.card .t{font-weight:600}
.card .m{color:var(--muted);font-size:.8rem}
.card .v{font-family:var(--display);font-size:1.05rem}
.card select{font-size:.78rem;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-top:4px}

/* Formulários */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.92rem;min-width:0;width:100%}
label.f textarea{min-height:64px;resize:vertical}
label.ck{display:flex;gap:8px;align-items:center;font-size:.88rem}

/* Orçamento */
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px}
.list button{background:none;border:0;border-left:2px solid transparent;text-align:left;padding:8px 10px;cursor:pointer;border-radius:0 8px 8px 0}
.list button:hover{background:var(--sunk)}
.list button[aria-current="true"]{border-left-color:var(--gold);background:var(--surface)}
.list .m{display:block;color:var(--muted);font-size:.78rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px}
.menu .cat{grid-column:1/-1;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px}
.kpi{border-left:2px solid var(--gold-soft);padding:2px 12px;min-width:0}
.kpi span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* Valores grandes (R$ 13.433,33) encolhem e podem quebrar antes de invadir o vizinho */
.kpi b{display:block;font-family:var(--display);font-size:clamp(1.05rem,1.5vw,1.4rem);font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.kpi.main b{font-size:clamp(1.2rem,1.9vw,1.75rem)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-bottom:0}
td input,td select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%;min-width:0}

/* Proposta */
.prop{background:#1B1A1A;color:#EFEBE3;border-radius:6px;padding:40px clamp(20px,5vw,56px);max-width:720px;margin:8px auto 0}
.prop .logo{display:flex;justify-content:center;color:#A09C6B}
.prop .logo svg{height:84px;width:auto;display:block}
.prop .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px;max-width:560px;margin:18px auto 0;text-align:center}
.prop .meta span{display:block;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:#A09C6B}
.prop .meta b{font-weight:500;font-family:var(--display);font-size:1rem}
.prop .prev{max-width:460px;margin:14px auto 0;font-size:.9rem}
.prop .prev>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid #A09C6B33;text-align:left}
.prop .prev>div>b{font-weight:500;white-space:nowrap}
.prop .prev small{display:block;color:#C9C3B6;font-size:.74rem;line-height:1.35;margin-top:2px}
.prop .prev .tot{border-bottom:0;padding-top:12px;font-family:var(--display);font-size:1.2rem}
.prop .prev .tot b{font-weight:600}
.prop .bloco{max-width:560px;margin:0 auto}
.prop .bloco p{color:#C9C3B6;font-size:.82rem;margin:6px 0;text-align:left;line-height:1.5}
.prop .bloco p.c{text-align:center}
.prop h2{text-align:center;font-weight:500;font-style:italic;margin:28px 0 4px;font-size:1.7rem}
.prop .sub{text-align:center;color:#C9C3B6;font-size:.85rem}
.prop .rule{height:1px;background:#A09C6B66;margin:24px auto;width:60%}
.prop .pc{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#A09C6B;text-align:center;margin-top:18px}
.prop .pi{text-align:center;font-family:var(--display);font-size:1.05rem;margin-top:4px}
.prop .inv{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;text-align:center}
.prop .inv b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:500}
.prop .inv span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#C9C3B6}
.prop .cond{color:#C9C3B6;font-size:.82rem;white-space:pre-wrap;text-align:center;margin-top:12px}

/* Proposta dentro de uma tabela: na tela não muda nada; na impressão o cabeçalho e o rodapé vazios repetem em cada página */
.ptbl{border-collapse:collapse;width:100%;max-width:720px;margin:8px auto 0;font-size:inherit}
.ptbl td{padding:0;border:0;vertical-align:top}
.pgap{height:0}
.ptbl .prop{margin:0;max-width:none}

/* Folhas impressas em fundo branco: ficha técnica e ordem de produção (montadas em #printarea só na hora de imprimir) */
#printarea{display:none}
.doc{color:#1B1A1A;font:10.5pt/1.45 var(--body);background:#fff}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1.5pt solid #1B1A1A;padding-bottom:8px;margin-bottom:14px}
.doc .dh svg{height:36px;width:auto;color:#1B1A1A;display:block}
.doc .dh .k{font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:#76713F;font-weight:600;text-align:right}
.doc h1{font-family:var(--display);font-size:19pt;font-weight:600;margin:0 0 4px}
.doc h2{font-family:var(--display);font-size:13pt;font-weight:600;margin:0 0 2px}
.doc .m{display:flex;flex-wrap:wrap;gap:3px 22px;font-size:9.5pt;color:#555;margin:0 0 10px}
.doc .m b{color:#1B1A1A;font-weight:600}
.doc .k2{font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;color:#76713F;font-weight:600;margin:16px 0 4px}
.doc table{width:100%;border-collapse:collapse;font-size:10pt;margin:6px 0 8px}
.doc th{font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase;color:#6B675E;font-weight:600;text-align:left;border-bottom:1pt solid #1B1A1A;padding:5px 6px}
.doc td{border-bottom:.5pt solid #D8D1C3;padding:5px 6px;vertical-align:top}
.doc td.r,.doc th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc td.ck,.doc th.ck{width:22px;padding-right:0}
.doc .bx{display:inline-block;width:10px;height:10px;border:1pt solid #1B1A1A;vertical-align:-1px}
.doc tfoot td{font-weight:600;border-bottom:0}
.doc .prep{white-space:pre-wrap;font-size:10pt;border-left:2pt solid #A09C6B;padding:4px 10px;margin:6px 0 0}
.doc .dsec{break-inside:avoid;margin-top:14px}
.doc .alerta{border:1pt solid #A3392B;color:#A3392B;padding:7px 10px;font-size:10pt;margin:0 0 12px}
.doc .rod{margin-top:18px;font-size:8pt;color:#6B675E}
.doc .pg+.pg{break-before:page}

/* Clientes */
.bdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:22px}
.bday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}
.bday .d{font-family:var(--display);font-size:1.6rem;color:var(--gold);min-width:46px;text-align:center;line-height:1}
.bday .d small{display:block;font-family:var(--body);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px}

/* Modal */
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:680px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:.88rem;max-width:calc(100% - 32px)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}

@media (max-width:820px){.split{grid-template-columns:1fr}.list{position:static;flex-direction:row;overflow-x:auto}.list button{border-left:0;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;min-width:170px}.list button[aria-current="true"]{border-bottom-color:var(--gold)}}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s}}
/* Impressão / PDF: só a proposta, página A4 inteira em carvão, cores preservadas */
@page{size:A4;margin:0}
@media print{
  header,.list,.tabs,.kpis,#oform .sec:not(#oout),.bar,#oout>h3,#oout>p,.noprint,.toast,#modal{display:none!important}
  html,body{background:#1B1A1A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:none;padding:0;margin:0}
  .split{display:block}
  .panel{border:0;padding:0;background:transparent;border-radius:0}
  #oout{padding:0;border:0}
  .prop,.prop *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ptbl{max-width:none;margin:0}.pgap{height:11mm}
  .prop{margin:0;border-radius:0;max-width:none;min-height:calc(297mm - 22mm);padding:4mm 20mm 8mm;box-sizing:border-box}
  .prop .meta,.prop .prev>div,.prop .bloco p,.prop .inv{break-inside:avoid}
  .prop .pc,.prop h2{break-after:avoid}
}
</style>
</head>

    <nav id="nav" aria-label="Seções"></nav>
    <div class="user" id="user"></div>

/* ---------- cálculo ---------- */
function custoFicha(f){return (f.itens||[]).reduce((a,it)=>{const i=byId("insumos",it.insumo);return a+(i?(+it.qtd||0)*(+i.custo||0):0)},0)}
function calc(o){
  const n=+o.convidados||0;
  const linhas=(o.cardapio||[]).map(id=>{const f=byId("fichas",id);if(!f)return null;
    const porcoes=n*(+f.porcoesPorPessoa||1);const fator=+f.rendimento?porcoes/(+f.rendimento):0;
    return {f,porcoes,fator,custo:fator*custoFicha(f)}}).filter(Boolean);
  const insumos=linhas.reduce((a,l)=>a+l.custo,0);
  const cmv=Math.max(1,+o.cmv||30)/100;
  const equipe=+o.equipe||0;
  const garcons=(+o.garconsQtd||0)*(+o.garconsValor||0);
  const loucas=+o.loucas||0;
  const extras=(o.extras||[]).map(x=>({descricao:String(x.descricao||"").trim(),valor:+x.valor||0}));
  const outros=extras.reduce((a,x)=>a+x.valor,0);
  const terceiros=garcons+loucas+outros;
  const sugerido=insumos/cmv+equipe+terceiros;
  const total=+o.precoFinal>0?+o.precoFinal:sugerido;
  // Gastronomia = tudo que não é terceirizado (se houver preço final, ele absorve a diferença aqui)
  const gastronomia=Math.max(0,total-terceiros);
  // Prévia por estação: cada estação leva a fatia da gastronomia proporcional ao seu custo de insumos
  const porCat={};linhas.forEach(l=>{porCat[l.f.categoria]=(porCat[l.f.categoria]||0)+l.custo});
  const estacoes=CATS.filter(c=>c.startsWith("Estação")&&porCat[c]>0).map(c=>({cat:c,valor:insumos?gastronomia*porCat[c]/insumos:0}));
  const gastronomiaResto=gastronomia-estacoes.reduce((a,e)=>a+e.valor,0);
  const compras={};
  linhas.forEach(l=>(l.f.itens||[]).forEach(it=>{compras[it.insumo]=(compras[it.insumo]||0)+(+it.qtd||0)*l.fator}));
  return {n,linhas,insumos,equipe,garcons,loucas,extras,outros,terceiros,gastronomia,estacoes,gastronomiaResto,sugerido,total,porPessoa:n?total/n:0,cmvReal:total?insumos/total*100:0,compras};
}

/* ---------- camada de dados (Supabase) ----------
   A tela continua usando os nomes do protótipo (camelCase); as tabelas usam snake_case.
   MAP traduz nos dois sentidos; só os campos listados vão para o banco. */
const MAP={
  insumos:{nome:"nome",unidade:"unidade",custo:"custo",exemplo:"exemplo"},
  fichas:{nome:"nome",categoria:"categoria",rendimento:"rendimento",porcoesPorPessoa:"porcoes_por_pessoa",itens:"itens",preparo:"preparo",exemplo:"exemplo"},
  clientes:{nome:"nome",telefone:"telefone",email:"email",aniversario:"aniversario",origem:"origem",pratoMarcante:"prato_marcante",restricoes:"restricoes",notas:"notas",consentimento:"consentimento",exemplo:"exemplo"},
  orcamentos:{cliente:"cliente",servico:"servico",tipoEvento:"tipo_evento",data:"data",cidade:"cidade",convidados:"convidados",origem:"origem",cardapio:"cardapio",cmv:"cmv",equipe:"equipe",precoFinal:"preco_final",pago:"pago",garconsQtd:"garcons_qtd",garconsValor:"garcons_valor",loucas:"loucas",horario:"horario",local:"local",sinal:"sinal",sinalAte:"sinal_ate",extras:"extras",textos:"textos",condicoes:"condicoes",etapa:"etapa",nota:"nota",comentario:"comentario",depoimento:"depoimento",exemplo:"exemplo"}
};
const NULAVEIS=new Set(["aniversario","data","cliente","nota","sinalAte"]);   // texto vazio vira null no banco
const NUMERICOS=new Set(["custo","rendimento","porcoesPorPessoa","convidados","cmv","equipe","precoFinal","pago","nota","garconsQtd","garconsValor","loucas","sinal"]);
function toRow(col,obj){
  const row={};
  for(const [k,c] of Object.entries(MAP[col])){
    if(!(k in obj))continue;
    let v=obj[k];
    if(NULAVEIS.has(k)&&(v===""||v===undefined))v=null;
    if(k==="convidados"&&v!==null)v=Math.round(+v||0);
    row[c]=v;
  }
  return row;
}
function fromRow(col,r){
  const o={id:r.id,criadoEm:r.criado_em,atualizadoEm:r.atualizado_em};
  for(const [k,c] of Object.entries(MAP[col])){
    let v=r[c];
    if(v===null||v===undefined)v=NULAVEIS.has(k)?"":v;
    else if(NUMERICOS.has(k))v=+v;
    o[k]=v;
  }
  return o;
}
function upsertLocal(col,item){const i=S[col].findIndex(x=>x.id===item.id);if(i<0)S[col].push(item);else S[col][i]=item}
function removeLocal(col,id){S[col]=S[col].filter(x=>x.id!==id)}

async function save(path,data){
  const [col,id]=path.split("/");
  if(!sb||!sessao){toast("Sem conexão com a base de dados.");return false}
  const row={id,...toRow(col,data)};
  const {data:ret,error}=await sb.from(col).upsert(row).select().single();
  if(error){
    if(error.code==="42501"||/row-level security/i.test(error.message)){canWrite=false;toast("Seu acesso não permite gravar. Peça ao administrador.")}
    else toast("Não foi possível salvar: "+error.message);
    return false;
  }
  upsertLocal(col,fromRow(col,ret));render();
  return true;
}
async function del(path){
  const [col,id]=path.split("/");
  if(!sb||!sessao)return;
  const {error}=await sb.from(col).delete().eq("id",id);
  if(error){toast("Não foi possível excluir: "+error.message);return}
  removeLocal(col,id);render();
}
const newId=()=>crypto.randomUUID();
const strip=o=>{const c=structuredClone(o);delete c.id;delete c.criadoEm;delete c.atualizadoEm;return c};

async function carregarTudo(){
  const cols=Object.keys(S);
  const res=await Promise.all(cols.map(c=>sb.from(c).select("*")));
  for(let i=0;i<cols.length;i++){
    if(res[i].error)throw res[i].error;
    S[cols[i]]=res[i].data.map(r=>fromRow(cols[i],r));
  }
  const cf=await sb.from("configuracoes").select("chave,valor");
  if(!cf.error){const rc=cf.data.find(x=>x.chave==="proposta");aplicarConfig(rc?rc.valor:null)}
  if(isAdmin())await carregarAdmin();
}
async function carregarAdmin(){
  const [p,c]=await Promise.all([sb.from("perfis").select("*").order("criado_em"),sb.from("convites").select("*").is("aceito_em",null).order("criado_em")]);
  if(!p.error)A.perfis=p.data;
  if(!c.error)A.convites=c.data;
}
function assinarRealtime(){
  if(canal){sb.removeChannel(canal)}
  canal=sb.channel("dados-studio");
  for(const col of Object.keys(S)){
    canal.on("postgres_changes",{event:"*",schema:"public",table:col},p=>{
      if(p.eventType==="DELETE")removeLocal(col,p.old.id);
      else upsertLocal(col,fromRow(col,p.new));
      render();
    });
  }
  canal.on("postgres_changes",{event:"*",schema:"public",table:"perfis"},async()=>{if(isAdmin()){await carregarAdmin();render()}});
  canal.on("postgres_changes",{event:"*",schema:"public",table:"convites"},async()=>{if(isAdmin()){await carregarAdmin();render()}});
  canal.on("postgres_changes",{event:"*",schema:"public",table:"configuracoes"},p=>{if(p.new&&p.new.chave==="proposta"){aplicarConfig(p.new.valor);render()}});
  canal.subscribe();
}

// Monta o documento a partir de dados já formatados (D). Sem DOM: dá para testar fora do navegador.
function montarDocx(docx,D){
  const {Document,Paragraph,TextRun,ImageRun,Table,TableRow,TableCell,WidthType,AlignmentType,BorderStyle}=docx;
  const GOLD="76713F",INK="1B1A1A",MUTED="6B675E",LINE="D8D1C3",F_T="Georgia",F_B="Calibri";
  const C=AlignmentType.CENTER;
  const P=(txt,o={})=>new Paragraph({alignment:o.al||AlignmentType.LEFT,spacing:{before:o.before||0,after:o.after===undefined?120:o.after},
    children:[new TextRun({text:txt,font:o.font||F_B,size:o.size||22,bold:!!o.bold,italics:!!o.it,color:o.color||INK})]});
  const rotulo=(t,o={})=>new Paragraph({alignment:C,spacing:{before:o.before===undefined?360:o.before,after:o.after===undefined?120:o.after},
    children:[new TextRun({text:t.toUpperCase(),font:F_B,size:o.size||16,bold:true,color:GOLD,characterSpacing:40})]});
  const nada={style:BorderStyle.NONE,size:0,color:"FFFFFF"};
  const bordas=(fundo)=>({top:nada,left:nada,right:nada,bottom:fundo?{style:BorderStyle.SINGLE,size:4,color:LINE}:nada});
  const linha=(desc,obs,valor,o={})=>new TableRow({children:[
    new TableCell({borders:bordas(!o.semLinha),width:{size:72,type:WidthType.PERCENTAGE},margins:{top:80,bottom:80,left:0,right:120},
      children:[P(desc,{bold:!!o.bold,size:o.size||22,after:0,font:o.bold?F_T:F_B}),...(obs?[P(obs,{size:17,color:MUTED,after:0})]:[])]}),
    new TableCell({borders:bordas(!o.semLinha),width:{size:28,type:WidthType.PERCENTAGE},margins:{top:80,bottom:80,left:0,right:0},
      children:[P(valor,{al:AlignmentType.RIGHT,bold:!!o.bold,size:o.size||22,after:0,font:o.bold?F_T:F_B})]})]});
  const ch=[];
  if(D.logo)ch.push(new Paragraph({alignment:C,spacing:{after:240},children:[new ImageRun({type:"png",data:D.logo,transformation:{width:200,height:Math.round(200*(D.logoRatio||0.37))}})]}));
  ch.push(new Paragraph({alignment:C,spacing:{after:280},children:[new TextRun({text:D.titulo,font:F_T,size:40,italics:true,color:INK})]}));
  D.meta.forEach(([l,v])=>ch.push(new Paragraph({alignment:C,spacing:{after:60},children:[new TextRun({text:l.toUpperCase()+"   ",font:F_B,size:15,bold:true,color:GOLD,characterSpacing:30}),new TextRun({text:v,font:F_T,size:22,color:INK})]})));
  ch.push(rotulo("Menu"));
  D.menu.forEach(g=>{ch.push(rotulo(g.cat,{before:200,after:40,size:15}));g.pratos.forEach(pr=>ch.push(P(pr,{al:C,font:F_T,after:40})))});
  ch.push(rotulo("Prévia de orçamento"));
  const rows=D.previa.map(x=>linha(x.desc,x.obs,x.valor));
  rows.push(linha("Valor total","",D.total,{bold:true,size:26,semLinha:true}));
  rows.push(linha("Por convidado","",D.porPessoa,{size:20,semLinha:true}));
  ch.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows}));
  if(D.pagamento.length){ch.push(rotulo("Pagamento"));D.pagamento.forEach(t=>ch.push(P(t,{size:20,color:MUTED})))}
  if(D.condicoes){ch.push(rotulo("Condições"));D.condicoes.split("\n").map(t=>t.trim()).filter(Boolean).forEach(t=>ch.push(P(t,{size:20,color:MUTED})))}
  if(D.observacoes.length){ch.push(rotulo("Observações importantes"));D.observacoes.forEach(t=>ch.push(P(t,{size:20,color:MUTED})))}
  if(D.validade)ch.push(P(D.validade,{al:C,size:20,before:240}));
  if(D.endereco)ch.push(P(D.endereco,{al:C,size:18,color:MUTED,before:360}));
  return new Document({creator:"Gestão Saimon Novack",title:D.titulo,
    styles:{default:{document:{run:{font:F_B,size:22,color:INK}}}},
    sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1304,right:1304}}},children:ch}]});
}

// Reúne os dados da proposta no mesmo formato da tela (mesmos textos e valores)
function dadosProposta(c,o,r,logo,logoRatio){
  const tx=k=>textoProposta(k,o);
  const pg=CFG_PROP.pagamento&&Object.values(CFG_PROP.pagamento).some(v=>String(v||"").trim())?CFG_PROP.pagamento:null;
  const meta=[["Cliente",c?c.nome:""],["Ocasião",o.tipoEvento||o.servico||""],["Data",dataBR(o.data)+(o.horario?" · "+o.horario:"")],["Convidados",num(r.n,0)],["Cidade / local",[o.cidade,o.local].filter(Boolean).join(" · ")]].filter(x=>x[1]);
  const menu=CATS.map(cat=>({cat,pratos:r.linhas.filter(l=>l.f.categoria===cat).map(l=>l.f.nome)})).filter(g=>g.pratos.length);
  const previa=r.estacoes.map(e=>({desc:e.cat,obs:"",valor:brl(e.valor)}));
  if(!r.estacoes.length||r.gastronomiaResto>0.005)previa.push({desc:"Gastronomia",obs:r.estacoes.length?"Demais itens do menu, equipe de cozinha e logística":"Menu completo, equipe de cozinha e logística",valor:brl(r.gastronomiaResto)});
  if(r.loucas>0)previa.push({desc:"Louças",obs:tx("loucas"),valor:brl(r.loucas)});
  if(r.garcons>0)previa.push({desc:"Garçons",obs:tx("garcons"),valor:brl(r.garcons)});
  r.extras.filter(x=>x.valor>0).forEach(x=>previa.push({desc:x.descricao||"Serviço extra",obs:"",valor:brl(x.valor)}));
  const pagamento=[];
  if((+o.sinal||0)>0)pagamento.push(`Solicitamos um sinal de ${brl(o.sinal)} para garantia da data${o.sinalAte?", até "+dataBR(o.sinalAte):""}, valor não reembolsável em caso de cancelamento.`);
  if(pg)pagamento.push(`Pagamento na conta do contratado: ${pg.empresa||""}${pg.cnpj?", CNPJ "+pg.cnpj:""}${pg.banco?" · "+pg.banco:""}${pg.agencia?" · Agência "+pg.agencia:""}${pg.conta?" · Conta "+pg.conta:""}${pg.pix?" · PIX "+pg.pix:""}.`);
  return {logo,logoRatio,titulo:"Proposta gastronômica",meta,menu,previa,total:brl(r.total),porPessoa:brl(r.porPessoa),pagamento,
    condicoes:o.condicoes||"",observacoes:tx("observacoes").split("\n").map(t=>t.trim()).filter(Boolean),
    validade:CFG_PROP.validadeDias>0?`Validade da proposta: ${num(CFG_PROP.validadeDias,0)} dias.`:"",endereco:CFG_PROP.endereco||""};
}
async function baixarDocx(c,o,r){
  const btn=$("#o_docx");if(btn){btn.disabled=true;btn.textContent="Gerando…"}
  try{
    const docx=await import("https://cdn.jsdelivr.net/npm/docx@9.11.0/+esm");
    let logo=null,logoRatio=336/914;
    try{const resp=await fetch("icons/sn-horizontal.png");if(resp.ok)logo=new Uint8Array(await resp.arrayBuffer())}catch(e){}
    const blob=await docx.Packer.toBlob(montarDocx(docx,dadosProposta(c,o,r,logo,logoRatio)));
    const nome=`Proposta ${(c&&c.nome)||"evento"}${o.data?" "+dataBR(o.data).replace(/\//g,"-"):""}.docx`.replace(/[\\/:*?"<>|]+/g,"-");
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){toast("Não foi possível gerar o DOCX: "+e.message)}
  finally{if(btn){btn.disabled=false;btn.textContent="Baixar em DOCX"}}
}

function modalFicha(id){

  const draw=()=>{
    $("#modal").innerHTML=`<div class="ov"><form class="modal" id="ff">
      <div><span class="eyebrow">Ficha técnica</span><h2>${id?esc(f.nome):"Nova ficha"}</h2></div>

        <label class="f">Rendimento (porções)<input id="f_rend" type="number" min="1" value="${+f.rendimento||1}"></label>
        <label class="f">Porções por convidado<input id="f_ppp" type="number" min="0.1" step="0.1" value="${+f.porcoesPorPessoa||1}"></label></div>
      <div class="tbl"><table><thead><tr><th>Insumo</th><th class="r" style="width:120px">Quantidade</th><th class="r" style="width:110px">Custo</th><th style="width:40px"></th></tr></thead><tbody>
        ${f.itens.map((it,k)=>{const i=byId("insumos",it.insumo);return `<tr><td><select data-k="${k}" data-p="insumo">${insOpts(it.insumo)}</select></td><td><input data-k="${k}" data-p="qtd" type="number" step="0.001" min="0" value="${+it.qtd||0}"></td><td class="r">${brl(i?(+it.qtd||0)*i.custo:0)}</td><td><button type="button" class="btn ghost sm" data-rm="${k}" aria-label="Remover">✕</button></td></tr>`}).join("")}
      </tbody><tfoot><tr><td colspan="2">Custo da receita</td><td class="r">${brl(custoFicha(f))}</td><td></td></tr></tfoot></table></div>
      <div><button type="button" class="btn sm" id="f_add" ${S.insumos.length?"":"disabled"}>Adicionar insumo</button></div>

      <div class="acts"><label class="ck" style="margin-right:auto;font-size:.82rem;color:var(--muted)"><input type="checkbox" id="f_pc" ${prefCustos?"checked":""}> imprimir com custos</label><button type="button" class="btn" id="f_print">Imprimir ou PDF</button>${id?'<button type="button" class="btn ghost" id="f_del">Excluir</button>':""}<button type="button" class="btn ghost" id="f_x">Cancelar</button><button class="btn pri" ${canWrite?"":"disabled"}>Salvar ficha</button></div>
    </form></div>`;
    const sync=()=>{f.nome=$("#f_nome").value;f.categoria=$("#f_cat").value;f.rendimento=+$("#f_rend").value||1;f.porcoesPorPessoa=+$("#f_ppp").value||1;f.preparo=$("#f_prep").value};
    $("#ff").addEventListener("change",e=>{const t=e.target;if(t.dataset.p){sync();f.itens[+t.dataset.k][t.dataset.p]=t.dataset.p==="qtd"?+t.value:t.value;draw()}});
    $("#ff").onclick=e=>{const b=e.target.closest("[data-rm]");if(b){sync();f.itens.splice(+b.dataset.rm,1);draw()}};
    $("#f_add").onclick=()=>{sync();f.itens.push({insumo:S.insumos[0].id,qtd:0});draw()};
    $("#f_x").onclick=()=>$("#modal").innerHTML="";
    $("#f_pc").onchange=e=>setPrefCustos(e.target.checked);
    $("#f_print").onclick=()=>{sync();imprimirDoc(htmlFicha(f,prefCustos),"Ficha técnica "+(f.nome||""))};
    if(id)$("#f_del").onclick=()=>confirmBox("Excluir esta ficha? Orçamentos que a usam perdem o prato.",async()=>{await del("fichas/"+id);$("#modal").innerHTML=""});
    $("#ff").onsubmit=async e=>{e.preventDefault();sync();if(!f.nome.trim()){toast("Dê um nome ao prato.");return}
      if(await save("fichas/"+(id||newId()),f)){$("#modal").innerHTML="";toast("Ficha salva.")}};
  };draw();
}

function proxAniv(s){if(!s)return null;const [ ,m,d]=String(s).split("-").map(Number);if(!m||!d)return null;
  const hoje=new Date();hoje.setHours(0,0,0,0);let n=new Date(hoje.getFullYear(),m-1,d);if(n<hoje)n=new Date(hoje.getFullYear()+1,m-1,d);return {dias:Math.round((n-hoje)/864e5),d,m}}
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function vClientes(){
  const ro=canWrite?"":"disabled";
  const bd=S.clientes.map(c=>({c,a:proxAniv(c.aniversario)})).filter(x=>x.a&&x.a.dias<=30).sort((a,b)=>a.a.dias-b.a.dias);
  const rows=S.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>{const ev=S.orcamentos.filter(o=>o.cliente===c.id);const notas=ev.filter(o=>o.nota);
    return `<tr><td><a href="#" data-c="${c.id}" style="color:var(--ink);font-weight:600">${esc(c.nome)}</a>${exChip(c)}<br><span style="color:var(--muted);font-size:.78rem">${esc(c.telefone||"")}</span></td>
      <td>${c.aniversario?dataBR(c.aniversario):"—"}</td><td>${esc(c.pratoMarcante||"—")}</td><td>${esc(c.restricoes||"—")}</td>
      <td class="r">${ev.length}${notas.length?` <span class="stars">★</span>${num(notas.reduce((a,o)=>a+ +o.nota,0)/notas.length,1)}`:""}</td>
      <td>${c.consentimento?'<span class="chip gold">autoriza</span>':'<span class="chip">sem consentimento</span>'}</td></tr>`}).join("");
  $("#app").innerHTML=`<div class="bar"><div><span class="eyebrow">Clientes</span><h2>Quem já sentou à mesa</h2><p>Aniversários, prato marcante e restrições, para o próximo evento e para ações comerciais. Ação comercial só para quem autorizou o contato.</p></div><button class="btn pri" id="nc" ${ro}>Novo cliente</button></div>
  <h3 style="margin-bottom:10px">Aniversários nos próximos 30 dias</h3>
  ${bd.length?`<div class="bdays">${bd.map(({c,a})=>`<div class="bday"><div class="d num">${a.d}<small>${MES[a.m-1]}</small></div><div style="min-width:0"><b>${esc(c.nome)}</b><div style="color:var(--muted);font-size:.8rem">${a.dias===0?"é hoje":`em ${a.dias} dia${a.dias===1?"":"s"}`}${c.pratoMarcante?" · gosta de "+esc(c.pratoMarcante):""}</div>${c.consentimento?"":'<div style="color:var(--warn);font-size:.76rem">sem consentimento para contato comercial</div>'}</div></div>`).join("")}</div>`:'<div class="empty" style="margin-bottom:22px">Nenhum aniversário nos próximos 30 dias.</div>'}
  ${S.clientes.length?`<div class="panel tbl"><table><thead><tr><th>Cliente</th><th>Aniversário</th><th>Prato marcante</th><th>Restrições</th><th class="r">Eventos</th><th>Marketing</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Nenhum cliente cadastrado.</div>'}`;
  $("#nc").onclick=()=>modalCliente(null);
  document.querySelectorAll("[data-c]").forEach(a=>a.onclick=e=>{e.preventDefault();modalCliente(a.dataset.c)});
}

  document.querySelectorAll("tr[data-p]").forEach(tr=>tr.addEventListener("change",async e=>{const f=e.target.dataset.f;if(!f)return;

    const {error}=await sb.from("perfis").update({[f]:v}).eq("id",tr.dataset.p);
    if(error)toast("Não foi possível alterar: "+error.message);else{await carregarAdmin();render();toast("Perfil atualizado.")}}));
  document.querySelectorAll("[data-rmp]").forEach(b=>b.onclick=()=>confirmBox("Remover este perfil? A pessoa perde o acesso aos dados.",async()=>{
    const {error}=await sb.from("perfis").delete().eq("id",b.dataset.rmp);if(error)toast("Não foi possível remover: "+error.message);await carregarAdmin();render()}));
  document.querySelectorAll("[data-rmc]").forEach(b=>b.onclick=async()=>{const {error}=await sb.from("convites").delete().eq("id",b.dataset.rmc);if(error)toast("Não foi possível cancelar: "+error.message);await carregarAdmin();render()});
  $("#fconv").onsubmit=async e=>{e.preventDefault();const email=$("#cv_mail").value.trim().toLowerCase();
    const {error}=await sb.from("convites").insert({email,papel:$("#cv_papel").value,criado_por:meu});
    if(error){toast(error.code==="23505"?"Já existe convite pendente para esse e-mail.":"Não foi possível convidar: "+error.message);return}
    await carregarAdmin();render();toast("Convite registrado para "+email+".")};
  $("#exportar").onclick=()=>{const blob=new Blob([JSON.stringify({exportadoEm:new Date().toISOString(),...S},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gestao-saimon-novack-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
  $("#fcfg").onsubmit=async e=>{e.preventDefault();const v=id=>$(id).value.trim();
    const valor={endereco:v("#cf_end"),loucasObs:v("#cf_lou"),garconsObs:v("#cf_gar"),
      pagamento:{empresa:v("#cf_emp"),cnpj:v("#cf_cnpj"),banco:v("#cf_banco"),agencia:v("#cf_ag"),conta:v("#cf_conta"),pix:v("#cf_pix")},
      observacoes:$("#cf_obs").value.split("\n").map(t=>t.trim()).filter(Boolean),validadeDias:Math.max(0,Math.round(+$("#cf_val").value||0))};
    const {error}=await sb.from("configuracoes").upsert({chave:"proposta",valor,atualizado_por:meu});
    if(error){toast("Não foi possível salvar: "+error.message);return}
    aplicarConfig(valor);toast("Dados da proposta salvos.")};
}

/* ---------- confirmação dentro da página ---------- */
function confirmBox(msg,fn){
  const box=document.createElement("div");box.className="ov";box.style.zIndex=25;
  box.innerHTML=`<div class="modal" style="max-width:420px"><p style="margin:0">${esc(msg)}</p><div class="acts"><button class="btn ghost" data-a="n">Cancelar</button><button class="btn pri" data-a="y">Excluir</button></div></div>`;
  box.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;box.remove();if(a==="y")await fn()};document.body.appendChild(box);
}

/* ---------- login e sessão ---------- */
// Link mágico (entrar por e-mail, sem senha) como alternativa discreta na tela de login.
// Troque para false para deixar só e-mail e senha.
const LINK_MAGICO=true;
const MSGS_AUTH=[
  [/at least \d+ characters|weak_password|password.*(short|weak)/i,"A senha precisa ter pelo menos 6 caracteres."],
  [/already (been )?registered|already exists|user_already_exists|email_exists/i,"Este e-mail já tem conta. Use \"Entrar\" ou \"Esqueci minha senha\"."],
  [/invalid login credentials|invalid_credentials/i,"E-mail ou senha incorretos."],
  [/email not confirmed|email_not_confirmed/i,"Este e-mail ainda não foi confirmado. Procure a mensagem de confirmação na sua caixa de entrada."],
  [/signups not allowed|signup_disabled|otp_disabled/i,"Não existe conta com este e-mail. Use \"Criar conta\"."],
  [/rate limit|too many|over_email_send_rate_limit|over_request_rate_limit/i,"Muitas tentativas em pouco tempo. Aguarde um minuto e tente de novo."],
  [/unable to validate email|invalid.*email|validation_failed/i,"E-mail inválido. Confira a digitação."],
  [/same.*password|different from the old|same_password/i,"A nova senha precisa ser diferente da anterior."],
  [/auth session missing|session_not_found|otp_expired|expired/i,"O link expirou ou já foi usado. Peça um novo."],
];
function msgAuth(error,padrao){
  const txt=error?String(error.code||"")+" "+String(error.message||""):"";
  for(const [re,m] of MSGS_AUTH)if(re.test(txt))return m;
  return padrao+(error&&error.message?" ("+error.message+")":"");
}
const urlRetorno=()=>location.origin+location.pathname;
let modoLogin="entrar";
function telaLogin(msg,modo){
  ready=false;renderNav();if(modo)modoLogin=modo;
  const aba=(k,t)=>`<button type="button" role="tab" aria-selected="${modoLogin===k}" data-m="${k}">${t}</button>`;
  const mail=`<label class="f">E-mail<input id="l_mail" type="email" required autocomplete="email" placeholder="voce@exemplo.com"></label>`;
  const corpo={
    entrar:`${mail}
      <label class="f">Senha<input id="l_senha" type="password" required autocomplete="current-password" minlength="6"></label>
      <button class="btn pri" id="l_btn">Entrar</button>
      <p style="text-align:center"><button type="button" class="btn ghost sm" data-m="esqueci">Esqueci minha senha</button>${LINK_MAGICO?`<button type="button" class="btn ghost sm" data-m="magico">Entrar por link no e-mail</button>`:""}</p>`,
    criar:`<label class="f">Seu nome<input id="l_nome" required autocomplete="name" placeholder="Como a equipe te chama"></label>
      ${mail}
      <label class="f">Senha<input id="l_senha" type="password" required autocomplete="new-password" minlength="6" placeholder="Pelo menos 6 caracteres"></label>
      <button class="btn pri" id="l_btn">Criar conta</button>
      <p>Se um administrador já convidou seu e-mail, você entra com o acesso liberado. Se não, a conta fica aguardando liberação na aba Usuários.</p>`,
    esqueci:`${mail}
      <button class="btn pri" id="l_btn">Enviar link de redefinição</button>
      <p>Você recebe um e-mail com um link. Abra-o neste mesmo aparelho para escolher a nova senha.</p>
      <p style="text-align:center"><button type="button" class="btn ghost sm" data-m="entrar">Voltar para Entrar</button></p>`,
    magico:`${mail}
      <button class="btn pri" id="l_btn">Receber link de acesso</button>
      <p>Enviamos um link para o seu e-mail; clique nele para entrar sem digitar a senha. Só funciona para conta já criada.</p>
      <p style="text-align:center"><button type="button" class="btn ghost sm" data-m="entrar">Voltar para Entrar</button></p>`,
  };
  $("#app").innerHTML=`<div class="login">
    <div><span class="eyebrow">Acesso</span><h2>${modoLogin==="criar"?"Criar conta":modoLogin==="esqueci"?"Redefinir senha":"Entrar no sistema"}</h2></div>
    ${msg?`<div class="notice">${esc(msg)}</div>`:""}
    <form class="panel" id="flogin">
      <div class="tabs" role="tablist">${aba("entrar","Entrar")}${aba("criar","Criar conta")}</div>
      ${corpo[modoLogin]||corpo.entrar}
    </form></div>`;
  $("#flogin").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>telaLogin(null,b.dataset.m));
  $("#flogin").onsubmit=async e=>{
    e.preventDefault();
    const email=$("#l_mail").value.trim().toLowerCase();
    const senha=$("#l_senha")?$("#l_senha").value:"";
    const nome=$("#l_nome")?$("#l_nome").value.trim():"";
    const btn=$("#l_btn");btn.disabled=true;
    try{
      if(modoLogin==="entrar"){
        const {error}=await sb.auth.signInWithPassword({email,password:senha});
        if(error){toast(msgAuth(error,"Não foi possível entrar"));return}
        $("#app").innerHTML='<div class="empty">Entrando…</div>';   // onAuthStateChange(SIGNED_IN) chama aoEntrar
      }else if(modoLogin==="criar"){
        const {data,error}=await sb.auth.signUp({email,password:senha,options:{data:{nome},emailRedirectTo:urlRetorno()}});
        if(error){toast(msgAuth(error,"Não foi possível criar a conta"));return}
        if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){toast(msgAuth({message:"already registered"}));return}
        if(!data.session)telaConfiraEmail(email,"Enviamos um e-mail de confirmação para <b>"+esc(email)+"</b>. Abra o link para ativar a conta e depois entre com sua senha.");
        // com sessão: onAuthStateChange(SIGNED_IN) chama aoEntrar
      }else if(modoLogin==="esqueci"){
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:urlRetorno()});
        if(error){toast(msgAuth(error,"Não foi possível enviar"));return}
        telaConfiraEmail(email,"Enviamos um link de redefinição de senha para <b>"+esc(email)+"</b>. Abra-o neste mesmo aparelho. Se não chegar em alguns minutos, veja a caixa de spam.");
      }else{
        const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:urlRetorno(),shouldCreateUser:false}});
        if(error){toast(msgAuth(error,"Não foi possível enviar"));return}
        telaConfiraEmail(email,"Enviamos um link de acesso para <b>"+esc(email)+"</b>. Abra-o neste mesmo aparelho. Se não chegar em alguns minutos, veja a caixa de spam.");
      }
    }finally{if(document.body.contains(btn))btn.disabled=false}
  };
}
function telaConfiraEmail(email,html){
  $("#app").innerHTML=`<div class="login"><div><span class="eyebrow">Acesso</span><h2>Confira seu e-mail</h2></div><div class="panel"><p>${html}</p></div><button class="btn ghost" id="l_volta">Voltar para Entrar</button></div>`;
  $("#l_volta").onclick=()=>telaLogin(null,"entrar");
}
let recuperando=/type=recovery/.test(location.hash);
// Erro trazido no hash pelo link de e-mail (expirado, já usado): mostrar uma vez na tela de login.
const hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
let erroLink=hashParams.get("error")||hashParams.get("error_code")?msgAuth({code:hashParams.get("error_code"),message:hashParams.get("error_description")},"O link do e-mail não pôde ser usado"):null;
if(erroLink)history.replaceState(null,"",urlRetorno());
function telaNovaSenha(){
  ready=false;renderNav();
  $("#app").innerHTML=`<div class="login"><div><span class="eyebrow">Acesso</span><h2>Definir nova senha</h2></div>
    <form class="panel" id="fsenha">
      <p>Você entrou como <b>${esc(sessao.user.email)}</b>. Escolha a nova senha.</p>
      <label class="f">Nova senha<input id="s_1" type="password" required autocomplete="new-password" minlength="6" placeholder="Pelo menos 6 caracteres"></label>
      <label class="f">Repita a nova senha<input id="s_2" type="password" required autocomplete="new-password" minlength="6"></label>
      <button class="btn pri" id="s_btn">Salvar senha</button>
    </form></div>`;
  $("#fsenha").onsubmit=async e=>{
    e.preventDefault();
    const a=$("#s_1").value,b=$("#s_2").value;
    if(a!==b){toast("As duas senhas não são iguais.");return}
    const btn=$("#s_btn");btn.disabled=true;
    const {error}=await sb.auth.updateUser({password:a});
    btn.disabled=false;
    if(error){toast(msgAuth(error,"Não foi possível salvar a senha"));return}
    recuperando=false;history.replaceState(null,"",urlRetorno());
    toast("Senha salva.");aoEntrar(sessao,true);
  };
}
function telaAguardando(){
  ready=false;renderNav();
  $("#app").innerHTML=`<div class="login"><div><span class="eyebrow">Acesso</span><h2>Aguardando liberação</h2></div>
    <div class="panel"><p>Você entrou como <b>${esc(sessao.user.email)}</b>, mas seu acesso ainda não foi liberado. Peça a um administrador do studio para ativar seu perfil na aba Usuários.</p></div>
    <button class="btn" id="l_rever">Verificar de novo</button></div>`;
  $("#l_rever").onclick=()=>aoEntrar(sessao,true);
}
async function sair(){
  await sb.auth.signOut();
  sessao=null;perfil=null;ready=false;draft=null;selOrc=null;view="funil";
  for(const k of Object.keys(S))S[k]=[];
  if(canal){sb.removeChannel(canal);canal=null}
  telaLogin(null,"entrar");
}
async function aoEntrar(s,forcar){
  if(!s){sessao=null;perfil=null;telaLogin(erroLink,"entrar");erroLink=null;return}
  if(sessao&&sessao.user.id===s.user.id&&ready&&!forcar){sessao=s;return}   // só renovação de token
  sessao=s;
  if(recuperando){telaNovaSenha();return}
  $("#app").innerHTML='<div class="empty">Carregando os dados do studio…</div>';
  const {data:p,error}=await sb.from("perfis").select("*").eq("id",s.user.id).maybeSingle();
  if(error){$("#app").innerHTML=`<div class="notice warn">Não foi possível ler seu perfil (${esc(error.message)}). Recarregue a página.</div>`;renderNav();return}
  perfil=p;
  if(!p||!p.ativo){telaAguardando();return}
  try{await carregarTudo()}catch(e){$("#app").innerHTML=`<div class="notice warn">Não foi possível ler os dados (${esc(e.message)}). Recarregue a página.</div>`;renderNav();return}
  canWrite=true;ready=true;assinarRealtime();render();
}

/* ---------- início ---------- */
(async()=>{
  const cfg=window.SN_CONFIG||{};
  if(!cfg.url||!cfg.anonKey||/^COLE_AQUI/.test(cfg.anonKey)){
    $("#app").innerHTML='<div class="notice warn">Falta configurar a conexão: preencha a chave do Supabase em <code>config.js</code>.</div>';return;
  }
  sb=createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  // Não fazer chamadas ao Supabase dentro do callback: adiar para o próximo tick evita travamento do cliente.
  sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>{
    if(ev==="SIGNED_OUT")return;       // sair() já cuida da tela
    if(ev==="PASSWORD_RECOVERY"){recuperando=true;sessao=s;telaNovaSenha();return}
    aoEntrar(s,false);
  },0)});
})();
</script>
